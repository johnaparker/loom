[package]
name = "gwt"
version = "0.2.0"
edition = "2024"
description = "Git worktree manager with tmux/sesh integration"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"

# Git operations
git2 = "0.20"

# TUI
ratatui = "0.30"
crossterm = "0.29"

# Fuzzy matching
nucleo = "0.5"

# Config & serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# HTTP client for Linear API
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde_json = "1.0"

# Utilities
dirs = "6.0"
anyhow = "1.0"
thiserror = "2.0"
colored = "3.0"
